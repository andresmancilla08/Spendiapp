<!doctype html>
<meta charset="utf-8">
<title>Personalización · cuatro direcciones</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05090a;color:#EEF6F8;font-family:Montserrat,sans-serif;padding:36px 28px 90px;line-height:1.45}
  .wrap{max-width:1700px;margin:0 auto}
  h1{font-size:29px;font-weight:800;letter-spacing:-.7px}
  .lede{color:#9EABAF;font-size:15px;margin-top:8px;max-width:78ch}
  h2{font-size:11.5px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:#00BCD4;margin:42px 0 6px;padding-top:22px;border-top:1px solid #1e2b2e}
  .h2sub{color:#7f9297;font-size:13px;margin-bottom:18px;max-width:80ch}
  p{font-size:14px;color:#9EABAF;max-width:82ch}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#152125;padding:1px 6px;border-radius:5px;color:#bfe9ef}
  .row{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .col{width:390px}
  .row.four .col{width:390px}
  .tag{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:3px}
  .tagsub{font-size:11.5px;color:#7f9297;margin-bottom:10px;min-height:32px}
  table{border-collapse:collapse;width:100%;margin-top:14px;font-size:13.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #1e2b2e;vertical-align:top}
  th{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:#7f9297;font-weight:700}
  td strong{color:#EEF6F8}
  ul{margin:8px 0 0 18px;font-size:14px;color:#9EABAF} li{margin:5px 0}
  .win{color:#00d6b4;font-weight:800} .kill{color:#F87171;font-weight:800} .meh{color:#FBBF24;font-weight:800}
  .note{border-left:3px solid #00BCD4;background:#0d1a1d;padding:12px 16px;border-radius:0 10px 10px 0;margin-top:16px;font-size:13.5px;color:#9EABAF}

  /* ── teléfono ── */
  .phone{width:390px;height:770px;border-radius:34px;overflow:hidden;position:relative;border:1px solid #223034;display:flex;flex-direction:column}
  .status{height:26px;flex-shrink:0}
  .hdr{display:flex;align-items:center;gap:10px;padding:6px 18px 2px}
  .hdr .back{font-size:19px;opacity:.75}
  .ttl{padding:6px 18px 12px}
  .ttl h3{font-size:23px;font-weight:800;letter-spacing:-.5px}
  .ttl p{font-size:12.5px;margin-top:3px}
  .body{flex:1;overflow:hidden;padding:0 16px 16px;position:relative}

  /* acordeón (estado actual) */
  .acc{border-radius:20px;margin-bottom:10px;overflow:hidden}
  .accH{display:flex;align-items:center;gap:10px;padding:15px 16px}
  .accIco{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .accT{flex:1;font-size:14px;font-weight:600}
  .accC{padding:0 16px 16px}
  .palGrid{display:flex;flex-wrap:wrap;gap:8px}
  .palCard{width:calc(33.33% - 5.34px);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid transparent}
  .swRow{display:flex}
  .sw{width:24px;height:24px;border-radius:12px;border:2px solid}
  .sw+.sw{margin-left:-9px}
  .palName{font-size:10px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  /* lienzo vivo */
  .canvas{border-radius:24px;overflow:hidden;position:relative;padding:16px;height:266px;display:flex;flex-direction:column;gap:10px}
  .cvTop{display:flex;align-items:center;gap:9px;position:relative;z-index:2}
  .avatar{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .cvHello{font-size:11px;opacity:.8}
  .cvBal{position:relative;z-index:2;margin-top:2px}
  .cvBal .lbl{font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
  .cvBal .amt{font-size:31px;font-weight:800;letter-spacing:-1px;margin-top:1px}
  .cvCard{position:relative;z-index:2;border-radius:16px;padding:12px 14px;overflow:hidden;margin-top:auto}
  .cvCardT{font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;opacity:.75}
  .catRow{display:flex;align-items:center;gap:7px;margin-top:8px}
  .dot{width:7px;height:7px;border-radius:3px}
  .catN{flex:1;font-size:11.5px;font-weight:600}
  .catP{font-size:11px;font-weight:700}
  .track{height:5px;border-radius:3px;margin-top:5px;overflow:hidden}
  .fill{height:100%;border-radius:3px}
  .sheen{position:absolute;top:-40px;bottom:-40px;width:56px;transform:rotate(12deg);animation:sweep 3.4s ease-in-out infinite}
  @keyframes sweep{0%{left:-70px;opacity:0}35%{opacity:.5}70%{left:110%;opacity:0}100%{left:110%;opacity:0}}
  .spark{position:relative;z-index:2;height:44px;margin-top:8px}

  /* fondos animados simulados */
  .fx{position:absolute;inset:0;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(26px);opacity:.55;animation:drift 12s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(26px,-20px) scale(1.15)}}
  .grid-fx{position:absolute;inset:0;background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:26px 26px}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.55;animation:tw 3s ease-in-out infinite alternate}
  @keyframes tw{to{opacity:.1}}
  @media (prefers-reduced-motion: reduce){.blob,.stars i,.sheen{animation:none}}

  /* chips / capítulos */
  .chips{display:flex;gap:7px;margin-top:14px}
  .chip{flex:1;height:36px;border-radius:50px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1.5px solid}
  .chipsScroll{display:flex;gap:7px;margin-top:14px;overflow:hidden}
  .chipS{height:34px;padding:0 13px;border-radius:50px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border:1.5px solid;white-space:nowrap}
  .grpLbl{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin:16px 0 8px}

  /* looks */
  .lookRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .look{width:calc(50% - 5px);border-radius:18px;overflow:hidden;border:1.5px solid;position:relative}
  .lookPrev{height:112px;position:relative;overflow:hidden;padding:10px}
  .lookMini{position:absolute;left:10px;right:10px;bottom:10px;border-radius:9px;height:30px;display:flex;align-items:center;padding:0 9px;font-size:9px;font-weight:800;letter-spacing:.4px}
  .lookMeta{padding:9px 11px 11px}
  .lookName{font-size:12px;font-weight:700}
  .lookSub{font-size:9.5px;margin-top:2px;opacity:.8}
  .lookCheck{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}

  /* editorial */
  .edRow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid}
  .edMeta{flex:1;min-width:0}
  .edL{font-size:13.5px;font-weight:600}
  .edS{font-size:11px;margin-top:2px}
  .edCtl{flex-shrink:0;display:flex;gap:5px;align-items:center}
  .miniSeg{display:flex;border-radius:9px;overflow:hidden;border:1px solid}
  .miniSeg span{padding:5px 9px;font-size:10.5px;font-weight:700}
  .swtch{width:38px;height:22px;border-radius:11px;position:relative}
  .swtch i{position:absolute;top:2px;width:18px;height:18px;border-radius:9px;background:#fff}
  .eyebrow{font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin:20px 0 2px}
  .rule{height:1px;margin:10px 0 2px}

  /* sticky preview (D) */
  .stick{border-radius:18px;overflow:hidden;position:relative;height:120px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
  .stickAmt{font-size:20px;font-weight:800;letter-spacing:-.6px;position:relative;z-index:2}
  .stickRow{display:flex;gap:6px;position:relative;z-index:2}
  .stickPill{height:20px;padding:0 8px;border-radius:10px;font-size:8.5px;font-weight:800;letter-spacing:.6px;display:flex;align-items:center}
  footer{margin-top:54px;padding-top:18px;border-top:1px solid #1e2b2e;color:#7f9297;font-size:12px}
</style>
<body><div class="wrap" id="root"></div>
<script>
const D = {"themes":{"dwDark":{"id":"deepWater","mode":"dark","name":"deepWater","preview":["#00ACC1","#00897B","#C0CA33"],"grad":["#0D1A1C","#062830","#003840"],"blobs":[["#00BCD4","#006978"],["#0097A7","#004D5A"],["#00897B","#004D40"],["#26C6DA","#0097A7"]],"primary":"#00BCD4","secondary":"#00A896","tertiary":"#D4E157","success":"#00A896","error":"#F87171","bg":"#0D1A1C","bg2":"#111F22","surface":"#162428","surface2":"#1E2E32","ink":"#EEF6F8","ink2":"#9EABAF","ink3":"#93A6AB","border":"#243438","accentInk":"#00BCD4","tint":"#00bcd4","pill":"#13363c","onPrimary":"#FFFFFF"},"dwLight":{"id":"deepWater","mode":"light","name":"deepWater","preview":["#00ACC1","#00897B","#C0CA33"],"grad":["#FFFFFF","#F5F9FA","#E0F7FA"],"blobs":[["#B2EBF2","#80DEEA"],["#80DEEA","#4DD0E1"],["#B2DFDB","#80CBC4"],["#E0F7FA","#B2EBF2"]],"primary":"#00ACC1","secondary":"#00897B","tertiary":"#C0CA33","success":"#00897B","error":"#EF4444","bg":"#FFFFFF","bg2":"#F0F7F8","surface":"#FFFFFF","surface2":"#EEF4F5","ink":"#1A2428","ink2":"#6B7280","ink3":"#6E737C","border":"#DDE8EA","accentInk":"#00838F","tint":"#008191","pill":"#e1f5f8","onPrimary":"#FFFFFF"},"sunset":{"id":"sunset","mode":"dark","name":"sunset","preview":["#F59E0B","#EF4444","#8B5CF6"],"grad":["#1C0D00","#2D1505","#180C1A"],"blobs":[["#F59E0B","#92400E"],["#EF4444","#7F1D1D"],["#D97706","#78350F"],["#FBBF24","#B45309"]],"primary":"#FBBF24","secondary":"#F87171","tertiary":"#A78BFA","success":"#22C55E","error":"#F87171","bg":"#1C0D00","bg2":"#241200","surface":"#2D1800","surface2":"#361D00","ink":"#FFF8F0","ink2":"#B09880","ink3":"#97816D","border":"#4A3018","accentInk":"#FBBF24","tint":"#fbbf24","pill":"#452c04","onPrimary":"#1A0F00"},"midnight":{"id":"midnight","mode":"dark","name":"midnight","preview":["#7C3AED","#4F46E5","#EC4899"],"grad":["#0D0B1A","#130D2C","#1A0D26"],"blobs":[["#A78BFA","#4C1D95"],["#818CF8","#312E81"],["#7C3AED","#2E1065"],["#C4B5FD","#6D28D9"]],"primary":"#A78BFA","secondary":"#818CF8","tertiary":"#F472B6","success":"#4ADE80","error":"#F87171","bg":"#0D0B1A","bg2":"#120F22","surface":"#18142E","surface2":"#1E1940","ink":"#F0EFF8","ink2":"#9B96AF","ink3":"#847D9E","border":"#2E2A52","accentInk":"#A78BFA","tint":"#a78bfa","pill":"#292246","onPrimary":"#FFFFFF"},"mint":{"id":"mint","mode":"dark","name":"mint","preview":["#10B981","#059669","#34D399"],"grad":["#051A10","#082E1C","#0A3820"],"blobs":[["#10B981","#064E3B"],["#059669","#022C22"],["#34D399","#065F46"],["#6EE7B7","#047857"]],"primary":"#34D399","secondary":"#10B981","tertiary":"#6EE7B7","success":"#34D399","error":"#F87171","bg":"#051A10","bg2":"#082018","surface":"#0A2E1C","surface2":"#0E3A24","ink":"#EDFFF6","ink2":"#7EC8A4","ink3":"#4F9E77","border":"#123A24","accentInk":"#34D399","tint":"#34d399","pill":"#0f412b","onPrimary":"#FFFFFF"},"mocha":{"id":"mocha","mode":"dark","name":"mocha","preview":["#92400E","#D97706","#FBBF24"],"grad":["#140805","#1E0E08","#1A0C05"],"blobs":[["#B45309","#451A03"],["#92400E","#3B1504"],["#78350F","#2C1104"],["#D97706","#7C2D12"]],"primary":"#D97706","secondary":"#B45309","tertiary":"#FBBF24","success":"#4ADE80","error":"#F87171","bg":"#140805","bg2":"#1C0E08","surface":"#28140A","surface2":"#341A0E","ink":"#F8F0E8","ink2":"#B09070","ink3":"#A67857","border":"#442010","accentInk":"#D97706","tint":"#d97706","pill":"#3d200a","onPrimary":"#FFFFFF"}},"all":[{"id":"deepWater","preview":["#00ACC1","#00897B","#C0CA33"]},{"id":"sunset","preview":["#F59E0B","#EF4444","#8B5CF6"]},{"id":"forest","preview":["#16A34A","#0D9488","#84CC16"]},{"id":"midnight","preview":["#7C3AED","#4F46E5","#EC4899"]},{"id":"rose","preview":["#E11D48","#DB2777","#F59E0B"]},{"id":"ocean","preview":["#0284C7","#0369A1","#06B6D4"]},{"id":"ember","preview":["#DC2626","#EA580C","#FBBF24"]},{"id":"lavender","preview":["#9333EA","#C084FC","#818CF8"]},{"id":"slate","preview":["#3B82F6","#64748B","#06B6D4"]},{"id":"deepWaterPastel","preview":["#80DEEA","#80CBC4","#DCE775"]},{"id":"sunsetPastel","preview":["#FBBF24","#FCA5A5","#C4B5FD"]},{"id":"forestPastel","preview":["#86EFAC","#99F6E4","#D9F99D"]},{"id":"midnightPastel","preview":["#A78BFA","#818CF8","#F9A8D4"]},{"id":"rosePastel","preview":["#FDA4AF","#FBCFE8","#FDE68A"]},{"id":"oceanPastel","preview":["#7DD3FC","#93C5FD","#67E8F9"]},{"id":"emberPastel","preview":["#FCA5A5","#FDBA74","#FDE68A"]},{"id":"lavenderPastel","preview":["#D8B4FE","#E9D5FF","#FBCFE8"]},{"id":"slatePastel","preview":["#93C5FD","#CBD5E1","#A5F3FC"]},{"id":"sakura","preview":["#F472B6","#EC4899","#FDE68A"]},{"id":"nordic","preview":["#64A8C8","#8DA8C0","#94BFDE"]},{"id":"cottonCandy","preview":["#F9A8D4","#93C5FD","#A5F3FC"]},{"id":"peach","preview":["#FDBA74","#FDE68A","#FCA5A5"]},{"id":"sakuraPastel","preview":["#FBCFE8","#F9A8D4","#FDE68A"]},{"id":"nordicPastel","preview":["#BAE6FD","#BFDBFE","#CBD5E1"]},{"id":"cottonCandyPastel","preview":["#FBCFE8","#BFDBFE","#CFFAFE"]},{"id":"peachPastel","preview":["#FED7AA","#FDE68A","#FECACA"]},{"id":"mint","preview":["#10B981","#059669","#34D399"]},{"id":"mintPastel","preview":["#6EE7B7","#A7F3D0","#BAE6FD"]},{"id":"aurora","preview":["#06B6D4","#7C3AED","#22C55E"]},{"id":"auroraPastel","preview":["#67E8F9","#C4B5FD","#86EFAC"]},{"id":"mocha","preview":["#92400E","#D97706","#FBBF24"]},{"id":"mochaPastel","preview":["#FCD9B0","#FDE8D0","#FEF3C7"]}]};
const T = D.themes;

const money = '$ 4.286.500';
const sparkPath = (w,h) => {
  const vals=[38,44,41,52,49,63,58,71,68,80,76,88];
  const max=Math.max(...vals), min=Math.min(...vals);
  return vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w, y=h-((v-min)/(max-min))*h;
    return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
};
const spark = (c, c2, h=44, area=true) => {
  const w=300, p=sparkPath(w,h-6);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    ${area?`<defs><linearGradient id="g${c.slice(1)}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${p} L${w},${h} L0,${h} Z" fill="url(#g${c.slice(1)})"/>`:''}
    <path d="${p}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${w}" cy="${(h-6)-((88-41)/(88-38))*(h-6)}" r="3.4" fill="${c2||c}"/></svg>`;
};
const fx = (th, kind) => {
  if (kind==='none') return '';
  if (kind==='grid') return `<div class="fx"><div class="grid-fx"></div></div>`;
  if (kind==='stars') return `<div class="fx stars">${Array.from({length:34},(_,i)=>
    `<i style="left:${(i*37)%100}%;top:${(i*53)%100}%;animation-delay:${(i%9)*.3}s"></i>`).join('')}</div>`;
  const b = th.blobs;
  return `<div class="fx">${b.map((pair,i)=>`<div class="blob" style="width:${150+i*36}px;height:${140+i*30}px;
    left:${[-16,52,18,68][i]}%;top:${[-14,-8,46,38][i]}%;
    background:radial-gradient(circle at 40% 40%, ${pair[0]}, ${pair[1]});animation-delay:${i*1.4}s"></div>`).join('')}</div>`;
};

/* ── el lienzo vivo: una maqueta del Home con el tema aplicado ── */
const canvas = (th, {kind='aurora', sheen=true, h=298, chart='area'}={}) => `
<div class="canvas" style="height:${h}px;background:linear-gradient(160deg,${th.grad[0]},${th.grad[1]} 55%,${th.grad[2]})">
  ${fx(th, kind)}
  <div class="cvTop">
    <div class="avatar" style="background:${th.primary};color:${th.onPrimary}">A</div>
    <div style="flex:1"><div class="cvHello" style="color:${th.ink2}">Hola, Andrés</div></div>
    <div style="font-size:15px;opacity:.6;color:${th.ink2}">🔔</div>
  </div>
  <div class="cvBal">
    <div class="lbl" style="color:${th.ink2}">balance del mes</div>
    <div class="amt" style="color:${th.ink}">${money}</div>
  </div>
  <div class="spark">${spark(th.tint, th.tertiary, 44, chart==='area')}</div>
  <div class="cvCard" style="background:${th.surface};border:1px solid ${th.border}">
    ${sheen?`<div class="sheen" style="background:linear-gradient(90deg,transparent,${th.ink}22,transparent)"></div>`:''}
    <div class="cvCardT" style="color:${th.ink2}">gastos por categoría</div>
    <div class="catRow"><div class="dot" style="background:${th.primary}"></div>
      <div class="catN" style="color:${th.ink}">Mercado</div><div class="catP" style="color:${th.tint}">42%</div></div>
    <div class="track" style="background:${th.border}"><div class="fill" style="width:42%;background:${th.tint}"></div></div>
  </div>
</div>`;

const phone = (th, inner, {bg}={}) => `
<div class="phone" style="background:${bg||th.bg}">
  <div class="status"></div>${inner}
</div>`;

const head = (th, title, sub) => `
  <div class="hdr"><div class="back" style="color:${th.ink2}">‹</div></div>
  <div class="ttl"><h3 style="color:${th.ink}">${title}</h3><p style="color:${th.ink2}">${sub}</p></div>`;

/* ══ HOY: acordeón de 7 secciones, una abierta ══ */
const today = (th) => phone(th, `
  ${head(th,'Personalización','Haz que Spendia se vea como tú')}
  <div class="body">
    <div class="acc" style="background:${th.surface}">
      <div class="accH"><div class="accIco" style="background:${th.pill};color:${th.tint}">🎨</div>
        <div class="accT" style="color:${th.ink}">Paleta de colores</div>
        <div style="color:${th.ink3};font-size:15px">⌃</div></div>
      <div class="accC">
        <div class="palGrid">
          ${D.all.slice(0,9).map((p,i)=>`
          <div class="palCard" style="background:${th.surface2};${i===0?`border-color:${th.primary}`:''}">
            <div class="swRow">${p.preview.map(c=>`<div class="sw" style="background:${c};border-color:${th.surface2}"></div>`).join('')}</div>
            <div class="palName" style="color:${i===0?th.tint:th.ink2}">${p.id.replace(/([A-Z])/g,' $1')}</div>
          </div>`).join('')}
        </div>
        <div style="text-align:center;font-size:10.5px;color:${th.ink3};margin-top:10px">+ 23 paletas más ↓</div>
      </div>
    </div>
    ${[['🖼️','Fondo animado'],['💳','Tarjetas'],['📈','Gráficos'],['⚙️','Iconos'],['🎁','Celebraciones'],['🚩','Lo que viene']]
      .map(([i,n])=>`
      <div class="acc" style="background:${th.surface}">
        <div class="accH"><div class="accIco" style="background:${th.pill};color:${th.tint}">${i}</div>
          <div class="accT" style="color:${th.ink}">${n}</div>
          <div style="color:${th.ink3};font-size:15px">⌄</div></div>
      </div>`).join('')}
  </div>`);

/* ══ A: lienzo vivo + capítulos ══ */
const dirA = (th) => phone(th, `
  ${head(th,'Tu Spendia','Cámbialo y míralo al instante')}
  <div class="body">
    ${canvas(th,{kind:'aurora'})}
