const spark = (c,h=26) => {
  const vals=[38,44,41,52,49,63,58,71,68,80,76,88], w=200;
  const p = vals.map((v,i)=>`${i?'L':'M'}${((i/(vals.length-1))*w).toFixed(1)},${(h-((v-38)/50)*h).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="position:relative;z-index:2;margin-top:5px;display:block">
    <defs><linearGradient id="g${c.slice(1)}${h}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}" stop-opacity=".4"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${p} L${w},${h} L0,${h} Z" fill="url(#g${c.slice(1)}${h})"/>
    <path d="${p}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
};
const mini = (t, tag) => `
<div class="mini" style="background:linear-gradient(160deg,${t.grad[0]},${t.grad[1]} 55%,${t.grad[2]})">
  <div class="fx">${t.blobs.map((pr,i)=>`<div class="blob" style="width:${86+i*22}px;height:${80+i*18}px;
    left:${[-14,52,20][i]}%;top:${[-16,-6,44][i]}%;background:radial-gradient(circle at 40% 40%,${pr[0]},${pr[1]})"></div>`).join('')}</div>
  <div class="lbl" style="color:${t.ink2}">balance</div>
  <div class="amt" style="color:${t.ink}">$ 4.28M</div>
  ${spark(t.tint)}
  <div class="cardMini" style="background:${t.surface};border:1px solid ${t.border}">
    <div class="cmT" style="color:${t.ink2}">gastos</div>
    <div class="rowM"><div class="dotM" style="background:${t.primary}"></div>
      <div class="nmM" style="color:${t.ink}">Mercado</div><div class="pcM" style="color:${t.tint}">42%</div></div>
    <div class="trM" style="background:${t.track}"><div style="height:100%;width:42%;border-radius:2px;background:${t.fill}"></div></div>
  </div>
  <div class="modeTag" style="color:${t.ink3}">${tag}</div>
</div>`;

const card = (p) => `
<div class="card ${p.nueva?'new':''}">
  ${p.nueva?'<div class="badge">NUEVA</div>':''}
  <div class="head">
    <div class="sws">${p.preview.map(c=>`<div class="sw" style="background:${c}"></div>`).join('')}</div>
    <div><div class="nm">${p.name}</div><div class="id">${p.id}</div></div>
  </div>
  <div class="duo">${mini(p.dark,'oscuro')}${mini(p.light,'claro')}</div>
</div>`;

const nuevas = P.filter(p=>p.nueva), viejas = P.filter(p=>!p.nueva);
