<!doctype html>
<meta charset="utf-8">
<title>Tendencia · maqueta a tamaño de móvil</title>
<style>
  :root { --primary:#e94b8b; --border:#e8e2e6; --surface:#fff; --ink:#1b1220; --muted:#9b8f97; --error:#e5484d; --success:#12a594; }
  body { margin:0; padding:24px; background:#f6f2f5; font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  h1 { font-size:18px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; font-size:13px; max-width:780px; line-height:1.5; }
  .phones { display:flex; gap:24px; flex-wrap:wrap; }
  .phone { width:390px; background:#fdfbfc; border:1px solid var(--border); border-radius:26px; padding:16px; }
  .phone h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px; }
  .cap { display:flex; align-items:center; gap:6px; font-size:9px; letter-spacing:.13em; color:var(--muted); font-weight:700; }
  .dot { width:5px; height:5px; border-radius:3px; background:var(--primary); }
  .head { display:flex; align-items:baseline; justify-content:space-between; margin:10px 0 2px; }
  .big { font-size:19px; font-weight:800; letter-spacing:-.5px; }
  .delta { font-size:12px; font-weight:700; }
  .months { display:flex; justify-content:space-between; margin-top:6px; padding:0 6px; }
  .months span { font-size:8.5px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .note { font-size:10.5px; color:var(--muted); margin:0; }
</style>
<h1>Tarjeta de tendencia — al ancho real del móvil</h1>
<p class="lead">Cada tarjeta mide lo que mide en un iPhone: 390 px de pantalla, 330 de gráfico. El alto pasa de 66 a 104 px — la proporción era de 5:1 y por eso se veía como un gusano estirado. Cuatro series distintas para comprobar que ninguna miente.</p>
<div class="phones" id="phones"></div>
<script>
const CASOS = [
  { n: 'Cinco meses flojos y un pico', v: [0, 0, 12000, 90000, 140000, 1100000] },
  { n: 'Gasto estable', v: [1840000, 2010000, 1720000, 2260000, 2050000, 2184500] },
  { n: 'Bajando mes a mes', v: [3200000, 2900000, 2500000, 2300000, 1900000, 1500000] },
  { n: 'Casi plano', v: [2000000, 2010000, 1995000, 2005000, 2000000, 2002000] },
];
const H = 104, PAD = 12, SVG_W = 330;   // 390 de pantalla − 16×2 de margen − 14×2 de tarjeta
const money = (n) => '$' + n.toLocaleString('es-CO');
const MESES = ['MAR','ABR','MAY','JUN','JUL','AGO'];

function smooth(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] ?? pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] ?? p2;
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]);
    const cl = (y) => Math.max(lo, Math.min(hi, y));
    d += ` C${p1[0]+(p2[0]-p0[0])/6} ${cl(p1[1]+(p2[1]-p0[1])/6)}, ${p2[0]-(p3[0]-p1[0])/6} ${cl(p2[1]-(p3[1]-p1[1])/6)}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}

function grafico(v, w) {
  const max = Math.max(...v), min = Math.min(...v), real = max - min;
  const span = Math.max(real, max * 0.35) || 1, base = min - (span - real) / 2;
  const usable = H - PAD * 2;
  const pts = v.map((x, i) => [ (i * (w - PAD*2)) / (v.length - 1) + PAD, H - PAD - ((x - base)/span) * usable ]);
  const line = smooth(pts);
  const [lx, ly] = pts.at(-1);
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg width="${w}" height="${H}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--primary)" stop-opacity=".28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0.34, 0.67].map(p => `<line x1="0" y1="${PAD + usable*p}" x2="${w}" y2="${PAD + usable*p}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,5" opacity=".55"/>`).join('')}
    <path d="${line} L${lx} ${H} L${pts[0][0]} ${H} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="5" fill="var(--primary)" opacity=".18"/>
    <circle cx="${lx}" cy="${ly}" r="3" fill="var(--primary)" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
}

document.getElementById('phones').innerHTML = CASOS.map(c => {
  const total = c.v.reduce((a, b) => a + b, 0);
  const prev = c.v.at(-2), last = c.v.at(-1);
  const delta = prev > 0 ? Math.round(((last - prev) / prev) * 100) : 0;
  const color = delta > 0 ? 'var(--error)' : 'var(--success)';
  return `<div class="phone">
    <h2>${c.n}</h2>
    <div class="card">
      <div class="cap"><span class="dot"></span>TENDENCIA · 6 MESES</div>
      <div class="head"><span class="big">${money(total)}</span><span class="delta" style="color:${color}">${delta > 0 ? '+' : ''}${delta}%</span></div>
      ${grafico(c.v, SVG_W)}
      <div class="months">${MESES.map(m => `<span>${m}</span>`).join('')}</div>
    </div>
    <p class="note">meses: ${c.v.map(x => (x/1e6).toFixed(2)).join(' · ')} (millones)</p>
  </div>`;
}).join('');
</script>
